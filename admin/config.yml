# GENERATED by scripts/cms-config.mjs from src/content/*.json — do not edit by hand.
# Run "npm run cms:config" after adding content files or fields.
# Sveltia CMS at https://kwetuconnect.org/admin/ — editor for people with a GitHub account.
# Sign in with "Sign In Using Access Token".
# Access token: fine-grained GitHub token for jacquesmofa/kwetu-connect (Contents: read and write).
site_url: "https://kwetuconnect.org"
logo_url: "https://res.cloudinary.com/dhjajm7ru/image/upload/c_pad,w_192,h_192,b_white,f_png/v1780004656/Kwetu_connect_Logo_-_best_size_for_favicon_ilrvqn.png"
backend:
  name: "github"
  repo: "jacquesmofa/kwetu-connect"
  branch: "main"
media_folder: "public/media/uploads"
public_folder: "/media/uploads"
collections:
  - name: "people"
    label: "1. Leadership"
    files:
      - name: "founder"
        label: "Mr Morris Kizito Mukasa: profile"
        file: "src/content/founder.json"
        format: "json"
        fields:
          - name: "name"
            label: "Name"
            required: false
            widget: "string"
          - name: "shortName"
            label: "Short name"
            required: false
            widget: "string"
          - name: "role"
            label: "Role"
            required: false
            widget: "string"
          - name: "titles"
            label: "Titles (gold line under the name)"
            required: false
            widget: "list"
            field:
              name: "item"
              label: "Item"
              required: false
              widget: "string"
          - name: "identity"
            label: "Identity lines"
            required: false
            widget: "list"
            field:
              name: "item"
              label: "Item"
              required: false
              widget: "string"
          - name: "photo"
            label: "Portrait"
            required: false
            widget: "image"
          - name: "photoAlt"
            label: "What the portrait shows (for screen readers)"
            required: false
            widget: "string"
          - name: "path"
            label: "Page address"
            required: false
            hint: "For example /about. Do not change."
            widget: "string"
          - name: "chapters"
            label: "Chapters"
            required: false
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - name: "id"
                label: "Chapter id (do not change)"
                required: false
                widget: "string"
              - name: "title"
                label: "Title (under 65 characters)"
                required: false
                widget: "string"
              - name: "blocks"
                label: "Text blocks, in order"
                required: false
                widget: "list"
                summary: "{{fields.type}}"
                fields:
                  - name: "type"
                    label: "Kind of block"
                    required: false
                    hint: "paragraph = plain text; list = bullet points."
                    widget: "string"
                  - name: "text"
                    label: "Text"
                    required: false
                    widget: "text"
                  - name: "items"
                    label: "Bullet points (for a list)"
                    required: false
                    widget: "list"
                    field:
                      name: "item"
                      label: "Item"
                      required: false
                      widget: "text"
              - name: "teaser"
                label: "Teaser (one line shown before \"Read more\")"
                required: false
                widget: "text"
  - name: "settings"
    label: "2. Google and sharing"
    files:
      - name: "seo"
        label: "Page titles, descriptions and share pictures"
        file: "src/content/seo.json"
        format: "json"
        fields:
          - name: "site"
            label: "Whole site (defaults)"
            required: false
            widget: "object"
            fields:
              - name: "name"
                label: "Name"
                required: false
                widget: "string"
              - name: "url"
                label: "Web address"
                required: false
                widget: "string"
              - name: "image"
                label: "Share picture (1200 × 630)"
                required: false
                widget: "image"
              - name: "imageAlt"
                label: "What the picture shows (for screen readers)"
                required: false
                widget: "string"
              - name: "locale"
                label: "Main language code"
                required: false
                widget: "string"
          - name: "pages"
            label: "Pages"
            required: false
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - name: "path"
                label: "Page address"
                required: false
                hint: "For example /about. Do not change."
                widget: "string"
              - name: "title"
                label: "Title (under 65 characters)"
                required: false
                widget: "string"
              - name: "description"
                label: "Description (120 to 160 characters)"
                required: false
                widget: "text"
              - name: "image"
                label: "Share picture (1200 × 630)"
                required: false
                widget: "image"
              - name: "imageAlt"
                label: "What the picture shows (for screen readers)"
                required: false
                widget: "string"
              - name: "imageWidth"
                label: "Share picture width"
                required: false
                widget: "number"
              - name: "imageHeight"
                label: "Share picture height"
                required: false
                widget: "number"
