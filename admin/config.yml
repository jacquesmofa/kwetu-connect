  - name: "settings"
    label: "7. Google and sharing"
    files:
      - name: "seo"
        label: "Page titles, descriptions and share pictures"
        file: "src/content/seo.json"
        format: "json"
        fields:
          - name: "site"
            label: "Whole site (defaults)"
            required: false
            widget: "object"
            fields:
              - name: "name"
                label: "Name"
                required: false
                widget: "string"
              - name: "url"
                label: "Web address or picture"
                required: false
                widget: "string"
              - name: "image"
                label: "Picture"
                required: false
                widget: "image"
              - name: "imageAlt"
                label: "What the picture shows (for screen readers)"
                required: false
                widget: "string"
              - name: "locale"
                label: "Main language code"
                required: false
                widget: "string"
          - name: "pages"
            label: "Pages"
            required: false
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - name: "path"
                label: "Page address"
                required: false
                hint: "For example /about. Do not change."
                widget: "string"
              - name: "title"
                label: "Title (under 65 characters)"
                required: false
                widget: "string"
              - name: "description"
                label: "Description (120 to 160 characters)"
                required: false
                widget: "text"
              - name: "image"
                label: "Picture"
                required: false
                widget: "image"
              - name: "imageAlt"
                label: "What the picture shows (for screen readers)"
                required: false
                widget: "string"
              - name: "imageWidth"
                label: "Share picture width"
                required: false
                widget: "number"
              - name: "imageHeight"
                label: "Share picture height"
                required: false
                widget: "number"
