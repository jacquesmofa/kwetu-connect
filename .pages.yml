# GENERATED by scripts/cms-config.mjs from src/content/*.json — do not edit by hand.
# Run "npm run cms:config" after adding content files or fields.
# Pages CMS (https://app.pagescms.org): editor for people without a GitHub account.
media:
  input: "public/media/uploads"
  output: "/media/uploads"
  rename: "safe"
  categories:
    - "image"
    - "document"
settings:
  commit:
    identity: "user"
content:
  - name: "founder"
    label: "Mr Morris Kizito Mukasa: profile"
    type: "file"
    path: "src/content/founder.json"
    format: "json"
    description: "His profile in chapters, shown at /about/morris-kizito-mukasa and previewed on Home, About and the CROP page. His own words: change only with his approval."
    fields:
      - name: "name"
        label: "Name"
        type: "string"
      - name: "shortName"
        label: "Short name"
        type: "string"
      - name: "role"
        label: "Role"
        type: "string"
      - name: "titles"
        label: "Titles (gold line under the name)"
        type: "string"
        list: true
      - name: "identity"
        label: "Identity lines"
        type: "string"
        list: true
      - name: "photo"
        label: "Portrait"
        type: "image"
      - name: "photoAlt"
        label: "What the portrait shows (for screen readers)"
        type: "string"
      - name: "path"
        label: "Page address"
        description: "For example /about. Do not change."
        type: "string"
      - name: "chapters"
        label: "Chapters"
        type: "object"
        list: true
        fields:
          - name: "id"
            label: "Chapter id (do not change)"
            type: "string"
          - name: "title"
            label: "Title (under 65 characters)"
            type: "string"
          - name: "blocks"
            label: "Text blocks, in order"
            type: "object"
            list: true
            fields:
              - name: "type"
                label: "Kind of block"
                description: "paragraph = plain text; list = bullet points."
                type: "string"
              - name: "text"
                label: "Text"
                type: "text"
              - name: "items"
                label: "Bullet points (for a list)"
                type: "text"
                list: true
          - name: "teaser"
            label: "Teaser (one line shown before \"Read more\")"
            type: "text"
  - name: "seo"
    label: "Page titles, descriptions and share pictures"
    type: "file"
    path: "src/content/seo.json"
    format: "json"
    description: "What Google, Facebook, WhatsApp and LinkedIn show for each page."
    fields:
      - name: "site"
        label: "Whole site (defaults)"
        type: "object"
        fields:
          - name: "name"
            label: "Name"
            type: "string"
          - name: "url"
            label: "Web address"
            type: "string"
          - name: "image"
            label: "Share picture (1200 × 630)"
            type: "image"
          - name: "imageAlt"
            label: "What the picture shows (for screen readers)"
            type: "string"
          - name: "locale"
            label: "Main language code"
            type: "string"
      - name: "pages"
        label: "Pages"
        type: "object"
        list: true
        fields:
          - name: "path"
            label: "Page address"
            description: "For example /about. Do not change."
            type: "string"
          - name: "title"
            label: "Title (under 65 characters)"
            type: "string"
          - name: "description"
            label: "Description (120 to 160 characters)"
            type: "text"
          - name: "image"
            label: "Share picture (1200 × 630)"
            type: "image"
          - name: "imageAlt"
            label: "What the picture shows (for screen readers)"
            type: "string"
          - name: "imageWidth"
            label: "Share picture width"
            type: "number"
          - name: "imageHeight"
            label: "Share picture height"
            type: "number"
